
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06110b">
<title>Sky Cricket Akodha | Live Score</title>
<style>
:root{--bg:#06110b;--card:#0e2116;--line:#244a32;--green:#39f581;--muted:#9db5a5;--white:#f4fff7;--gold:#ffd36a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:system-ui,Arial,sans-serif}
button{font:inherit;cursor:pointer}
header{padding:17px 16px;background:#0b1c11;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:18px}
.logo{width:43px;height:43px;display:grid;place-items:center;background:var(--green);color:#041008;border-radius:14px;font-size:24px}
.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:2px}
.wrap{max-width:1000px;margin:auto;padding:16px}
.hero{padding:24px 0}
.kicker{font-size:11px;letter-spacing:2px;color:var(--green);font-weight:900}
h1{font-size:clamp(30px,7vw,46px);line-height:1.05;margin:9px 0}
h1 span{color:var(--green)}
.sub{color:var(--muted);font-size:13px;line-height:1.6}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
button{border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:#13291a;color:white;font-weight:750;font-size:12px}
button.active,button.primary{background:var(--green);color:#041008;border-color:var(--green)}
.status{padding:12px;background:#102218;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px;line-height:1.6;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.card{background:linear-gradient(145deg,#11271a,#0a1710);border:1px solid var(--line);border-radius:19px;overflow:hidden}
.cardhead{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
.badge{border-radius:99px;background:#153d24;color:var(--green);padding:6px 9px;font-weight:900}
.badge.done{background:#392e13;color:var(--gold)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:13px}
.team{background:#08150c;border:1px solid #203e2a;border-radius:14px;padding:13px 8px;text-align:center;min-width:0}
.flag{font-size:27px}
.teamname{font-weight:850;font-size:12px;margin:7px 0;overflow-wrap:anywhere}
.score{font-size:23px;color:var(--green);font-weight:950;overflow-wrap:anywhere}
.overs{font-size:10px;color:var(--muted);margin-top:4px}
.statusline{padding:0 14px 14px;font-size:12px;color:#d6e5d9;line-height:1.6}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 13px 14px}
.details{padding:14px;border-top:1px solid var(--line)}
.details summary{font-weight:850;color:var(--green);cursor:pointer;font-size:13px}
.innings{margin-top:13px;background:#08150c;border:1px solid #203e2a;border-radius:13px;overflow:hidden}
.innings h3{font-size:12px;margin:0;padding:12px;background:#14291a}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:11px;min-width:400px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #1d3826;white-space:nowrap}
th{color:var(--muted);font-weight:700}
.player{display:flex;align-items:center;gap:8px;font-weight:800}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#1a3824;border:1px solid #39734a;flex-shrink:0}
.fallback{display:grid;place-items:center;font-size:17px}
.empty{text-align:center;padding:25px 15px;border:1px dashed var(--line);border-radius:15px;color:var(--muted);font-size:13px;line-height:1.7}
footer{text-align:center;color:var(--muted);font-size:11px;padding:28px 15px 40px}
@media(min-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🏏</div>
    <div>SKY CRICKET<small>AKODHA · WORLD CRICKET</small></div>
  </div>
</header>
<main class="wrap">
  <section class="hero">
    <div class="kicker">YOUR PREMIUM CRICKET HUB</div>
    <h1>Every Match.<br><span>Every Player.</span></h1>
    <div class="sub">Live scores, player scorecards and match updates in one place.</div>
    <div class="toolbar">
      <button class="active" data-filter="all">All Matches</button>
      <button data-filter="live">🔴 Live</button>
      <button data-filter="upcoming">Upcoming</button>
      <button data-filter="completed">Results</button>
      <button class="primary" id="refresh">↻ Refresh</button>
    </div>
    <div class="status" id="status">Connecting to cricket API…</div>
  </section>
  <section id="matches" class="grid"></section>
</main>
<footer>SKY CRICKET AKODHA · Match data depends on API availability and plan.</footer>

<script>
const API="https://sky-cricket-live.skyyadavanshi.workers.dev/live-score";
const SCORECARD="https://sky-cricket-live.skyyadavanshi.workers.dev/scorecard?id=";
const $=id=>document.getElementById(id);
let all=[],filter="all",busy=false;

function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function kind(m){
 const s=String(m.status||"").toLowerCase();
 if(/won|result|complete|abandon|no result|cancel|draw|tied/.test(s))return "completed";
 if(/live|in progress|innings|stumps|day \d/.test(s))return "live";
 return "upcoming";
}
function flag(name){
 const n=String(name||"").toLowerCase();
 const list=[
  ["india","🇮🇳"],["australia","🇦🇺"],["england","🏴"],["pakistan","🇵🇰"],
  ["south africa","🇿🇦"],["new zealand","🇳🇿"],["sri lanka","🇱🇰"],
  ["bangladesh","🇧🇩"],["afghanistan","🇦🇫"],["west indies","🏝️"],
  ["ireland","🇮🇪"],["zimbabwe","🇿🇼"],["nepal","🇳🇵"],["usa","🇺🇸"]
 ];
 return (list.find(([k])=>n.includes(k))||[])[1]||"🏏";
}
function score(s){
 return `<div class="score">${esc(s.r??"—")}/${esc(s.w??"—")}</div><div class="overs">${esc(s.o??"—")} overs · ${esc(s.inning||"")}</div>`;
}
function teamCard(name,s){
 return `<div class="team"><div class="flag">${flag(name)}</div><div class="teamname">${esc(name||"Team TBC")}</div>${s?score(s):'<div class="overs">Score unavailable</div>'}</div>`;
}
function matchCard(m,i){
 const teams=Array.isArray(m.teams)?m.teams:[];
 const scores=Array.isArray(m.score)?m.score:[];
 const k=kind(m),id=String(m.id||"");
 const valid=/^[\w-]+$/.test(id);
 return `<article class="card">
 <div class="cardhead"><span>${esc(m.matchType||"CRICKET")} · ${esc(m.date||"")}</span><span class="badge ${k==="completed"?"done":""}">${k==="live"?"● LIVE":k==="completed"?"RESULT":"FIXTURE"}</span></div>
 <div class="teams">${teamCard(teams[0],scores[0])}${teamCard(teams[1],scores[1])}</div>
 <div class="statusline">${esc(m.status||"Match status unavailable")}<br>📍 ${esc(m.venue||"Venue unavailable")}</div>
 <div class="actions">${valid?`<button class="primary" data-score="${esc(id)}" data-card="sc${i}">🏏 Full Scoreboard</button>`:""}<button data-info="${i}">Match Info</button></div>
 <div class="details" id="sc${i}" hidden></div>
 <div class="details" id="info${i}" hidden><p class="sub">${esc(m.name||"")}<br>${esc(m.dateTimeGMT||m.date||"")}</p></div>
 </article>`;
}
function render(){
 const list=filter==="all"?all:all.filter(m=>kind(m)===filter);
 $("matches").innerHTML=list.length?list.map((m,i)=>matchCard(m,i)).join(""):`<div class="empty">इस श्रेणी में अभी कोई मैच API से नहीं मिला।</div>`;
}
async function load(){
 if(busy)return;
 busy=true;$("refresh").disabled=true;$("status").textContent="Fetching match data…";
 try{
  const r=await fetch(API,{cache:"no-store"});
  const b=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(b.message||b.error||"API HTTP "+r.status);
  if(b.status&&b.status!=="success")throw Error(b.message||b.error||"API request failed");
  if(!Array.isArray(b.data))throw Error("API response में match list नहीं मिली");
  all=b.data;
  $("status").textContent=`${all.length} matches loaded · Updated ${new Date().toLocaleTimeString()}`;
  render();
 }catch(e){
  $("status").textContent="Live data unavailable: "+e.message+". API limit या Worker जाँचें।";
  if(!all.length)$("matches").innerHTML=`<div class="empty">🏏 Live score अभी उपलब्ध नहीं है।<br>API की रोक हटने पर Refresh करें।</div>`;
 }finally{busy=false;$("refresh").disabled=false}
}
$("refresh").addEventListener("click",load);
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{
 filter=b.dataset.filter;
 document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));
 render();
}));
$("matches").addEventListener("click",async e=>{
 const info=e.target.closest("[data-info]");
 if(info){
  const target=$("info"+info.dataset.info);
  target.hidden=!target.hidden;return;
 }
 const btn=e.target.closest("[data-score]");
 if(!btn)return;
 const target=$(btn.dataset.card);
 target.hidden=!target.hidden;
 if(target.dataset.loaded==="1")return;
 target.innerHTML='<div class="sub">Loading full scorecard…</div>';
 try{
  const r=await fetch(SCORECARD+encodeURIComponent(btn.dataset.score),{cache:"no-store"});
  const b=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(b.message||b.error||"HTTP "+r.status);
  const data=b.data??b;
  target.innerHTML=renderScorecard(data);
  target.dataset.loaded="1";
 }catch(err){
  target.innerHTML=`<div class="sub">Scorecard unavailable: ${esc(err.message)}</div>`;
 }
});
function renderScorecard(data){
 // API scorecard schemas vary. Show player and innings tables when available.
 const innings=Array.isArray(data)?data:
  (data.scorecard||data.innings||data.data||[]);
 if(!Array.isArray(innings)||!innings.length)
  return `<div class="sub">API ने scorecard का data नहीं लौटाया। इस API plan में विस्तृत scorecard उपलब्ध है या नहीं, जाँचें।<pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(JSON.stringify(data,null,2))}</pre></div>`;
 return innings.map((inn,i)=>{
  const batting=inn.batting||inn.batsmen||inn.batsman||[];
  const bowling=inn.bowling||inn.bowlers||inn.bowler||[];
  return `<div class="innings"><h3>${esc(inn.inning||inn.team||"Innings "+(i+1))}</h3>
  ${playerTable("Batting",batting,"bat")}
  ${playerTable("Bowling",bowling,"bowl")}
  </div>`;
 }).join("");
}
function playerTable(title,rows,type){
 if(!Array.isArray(rows)||!rows.length)return "";
 const cols=type==="bat"?[
  ["name","Player"],["r","R"],["b","B"],["4s","4s"],["6s","6s"],["sr","SR"]
 ]:[
  ["name","Bowler"],["o","O"],["r","R"],["w","W"],["econ","Econ"]
 ];
 return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join("")}</tr></thead><tbody>
 ${rows.map(p=>{
  const name=p.name||p.batsman||p.bowler||p.player||"Player";
  const pic=p.playerImg||p.image||p.photo||p.img||"";
  return `<tr><td><div class="player"><img class="avatar" src="${esc(pic)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;avatar fallback&quot;>🏏</span>'"><span>${esc(name)}</span></div></td>
  ${cols.slice(1).map(c=>`<td>${esc(p[c[0]]??p[c[0]==="r"?"runs":c[0]==="w"?"wickets":c[0]==="o"?"overs":c[0]]??"—")}</td>`).join("")}</tr>`;
 }).join("")}</tbody></table></div>`;
}
load();
// Poll every five minutes to reduce free API requests.
setInterval(load,300000);
</script>
</body>
</html>

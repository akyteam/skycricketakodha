
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky Cricket Akodha - Live Score</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07130e;
      color: white;
    }
    header {
      background: #123d29;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #22c55e;
    }
    h1 { margin: 0; color: #4ade80; }
    .subtitle { margin-top: 8px; color: #ddd; }
    #status { text-align: center; padding: 16px; color: #facc15; }
    #matches {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 14px;
      padding: 14px;
    }
    .card {
      background: #10251b;
      border: 1px solid #286343;
      border-radius: 12px;
      padding: 16px;
    }
    .teams { font-size: 18px; font-weight: bold; }
    .score { color: #4ade80; font-size: 17px; margin-top: 12px; }
    .details { color: #cbd5e1; line-height: 1.7; margin-top: 10px; }
    .live { color: #fb7185; font-weight: bold; }
    button {
      background: #16a34a; color: white; border: 0;
      border-radius: 8px; padding: 10px 14px; margin-top: 12px;
    }
    footer { text-align: center; padding: 20px; color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <h1>🏏 Sky Cricket Akodha</h1>
    <div class="subtitle">Live Cricket Scores • Worldwide</div>
  </header>

  <div id="status">Live scores लोड हो रहे हैं...</div>
  <main id="matches"></main>
  <footer>Sky Cricket Akodha | Score data provided by cricket API</footer>

  <script>
    const API_URL =
      "https://sky-cricket-live.skyyadavanshi.workers.dev/live-score";

    const matchesEl = document.getElementById("matches");
    const statusEl = document.getElementById("status");

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    function showScore(match) {
      const teams = Array.isArray(match.teams) ? match.teams : [];
      const scores = Array.isArray(match.score) ? match.score : [];
      const name = teams.length ? teams.join(" vs ") : "Match";
      const scoreText = scores.map(s => {
        const innings = s.inning || "";
        const runs = s.r ?? 0;
        const wickets = s.w ?? 0;
        const overs = s.o ?? 0;
        return `${innings}: ${runs}/${wickets} (${overs} overs)`;
      }).join("<br>");

      const live = /live|in progress|innings|stumps/i.test(
        String(match.status || "")
      );

      const id = String(match.id || "");
      const scorecardButton = /^[a-zA-Z0-9_-]+$/.test(id)
        ? `<button data-id="${escapeHTML(id)}">Scorecard</button>`
        : "";

      return `
        <article class="card">
          <div class="teams">${escapeHTML(name)}</div>
          <div class="details ${live ? "live" : ""}">
            ${escapeHTML(match.matchType || "Cricket")} ·
            ${escapeHTML(match.status || "Status unavailable")}
          </div>
          <div class="score">${scoreText || "Score details not available"}</div>
          <div class="details">
            Venue: ${escapeHTML(match.venue || "Not available")}<br>
            Date: ${escapeHTML(match.date || "Not available")}
          </div>
          ${scorecardButton}
          <div class="details" data-scorecard="${escapeHTML(id)}"></div>
        </article>`;
    }

    async function loadMatches() {
      statusEl.textContent = "Live scores लोड हो रहे हैं...";
      try {
        const response = await fetch(API_URL, { cache: "no-store" });
        if (!response.ok) throw new Error("API HTTP " + response.status);

        const result = await response.json();
        if (result.status && result.status !== "success") {
          throw new Error(result.message || "API request failed");
        }

        const matches = result.data;
        if (!Array.isArray(matches) || matches.length === 0) {
          matchesEl.innerHTML = "";
          statusEl.textContent =
            "अभी API से मैच नहीं मिले। बाद में फिर जाँचें।";
          return;
        }

        matchesEl.innerHTML = matches.map(showScore).join("");
        statusEl.textContent =
          `API से ${matches.length} मैच मिले · अपडेट: ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        statusEl.textContent =
          "Live score लोड नहीं हुआ: " + error.message;
      }
    }

    matchesEl.addEventListener("click", async event => {
      const button = event.target.closest("button[data-id]");
      if (!button) return;

      const id = button.dataset.id;
      const output = button.parentElement.querySelector("[data-scorecard]");
      output.textContent = "Scorecard लोड हो रहा है...";

      try {
        const url =
          "https://sky-cricket-live.skyyadavanshi.workers.dev/scorecard?id=" +
          encodeURIComponent(id);
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const result = await response.json();

        output.textContent = JSON.stringify(result.data ?? result, null, 2);
      } catch (error) {
        output.textContent =
          "Scorecard उपलब्ध नहीं: " + error.message;
      }
    });

    loadMatches();
    setInterval(loadMatches, 60000);
  </script>
</body>
</html>

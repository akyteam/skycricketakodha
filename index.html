<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06110b">
<title>Sky Cricket Akodha</title>
<style>
:root{--bg:#06110b;--card:#102219;--line:#28513a;--green:#43f58b;--muted:#a6bdad;--white:#f5fff7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:system-ui,Arial,sans-serif}
header{padding:16px;background:#0b1b11;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
.brand{font-size:19px;font-weight:900}.brand span{color:var(--green)}
main{max-width:1000px;margin:auto;padding:16px}
h1{font-size:34px;line-height:1.1;margin:12px 0}
p,.muted{color:var(--muted);font-size:13px;line-height:1.6}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
button{border:1px solid var(--line);background:#142c1d;color:white;padding:10px 13px;border-radius:10px;font-weight:750}
button.active,.primary{background:var(--green);color:#041108}
#status{padding:12px;border:1px solid var(--line);border-radius:12px;margin:12px 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.card{background:linear-gradient(145deg,#11271a,#0a1710);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.head{display:flex;justify-content:space-between;gap:8px;padding:13px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
.badge{color:var(--green);font-weight:900}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.team{background:#08150c;border:1px solid var(--line);border-radius:12px;padding:12px 5px;text-align:center;overflow-wrap:anywhere}
.flag{font-size:30px}.teamname{font-size:12px;font-weight:850;margin:7px 0}
.score{font-size:22px;color:var(--green);font-weight:900}
.small{font-size:10px;color:var(--muted)}
.statusline{padding:0 13px 13px;font-size:12px;line-height:1.6}
.actions{display:flex;flex-wrap:wrap;gap:8px;padding:0 13px 13px}
.details{padding:12px;border-top:1px solid var(--line)}
.details summary{color:var(--green);font-weight:850;cursor:pointer}
.tablewrap{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;min-width:380px;font-size:11px}
td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted)}
.inning{border:1px solid var(--line);border-radius:10px;margin-top:12px;overflow:hidden}
.inning h3{font-size:13px;margin:0;padding:12px;background:#142c1d}
.empty{padding:22px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px;line-height:1.7}
footer{text-align:center;padding:25px;color:var(--muted);font-size:11px}
@media(min-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div class="brand">🏏 SKY CRICKET <span>AKODHA</span></div></header>
<main>
<h1>Every Match.<br><span style="color:var(--green)">Every Score.</span></h1>
<p>Available cricket matches, country flags, player names and scorecards.</p>
<div class="toolbar">
<button class="active" data-filter="all">All Matches</button>
<button data-filter="live">🔴 Live</button>
<button data-filter="upcoming">Upcoming</button>
<button data-filter="completed">Results</button>
<button id="refresh" class="primary">↻ Refresh</button>
</div>
<div id="status">Connecting to match service…</div>
<div id="matches" class="grid"></div>
</main>
<footer>SKY CRICKET AKODHA · Match coverage depends on the data provider.</footer>
<script>
"use strict";
const API="https://sky-cricket-live.skyyadavanshi.workers.dev/live-score";
const SCORECARD="https://sky-cricket-live.skyyadavanshi.workers.dev/scorecard?id=";
const $=id=>document.getElementById(id);
let all=[],filter="all",busy=false;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const countries=[
["india","🇮🇳"],["australia","🇦🇺"],["england","🏴"],["pakistan","🇵🇰"],
["new zealand","🇳🇿"],["south africa","🇿🇦"],["sri lanka","🇱🇰"],
["bangladesh","🇧🇩"],["afghanistan","🇦🇫"],["west indies","🏝️"],
["ireland","🇮🇪"],["zimbabwe","🇿🇼"],["nepal","🇳🇵"],
["united states","🇺🇸"],["usa","🇺🇸"],["netherlands","🇳🇱"],
["scotland","🏴"],["uae","🇦🇪"],["oman","🇴🇲"],["canada","🇨🇦"],
["hong kong","🇭🇰"],["namibia","🇳🇦"],["uganda","🇺🇬"],
["papua new guinea","🇵🇬"],["kenya","🇰🇪"]
];
function flag(name){
 const n=String(name||"").toLowerCase();
 return (countries.find(([k])=>n.includes(k))||[])[1]||"🏏";
}
function kind(m){
 const s=String(m.status||m.matchStatus||"").toLowerCase();
 if(/won|result|complete|abandon|no result|cancel|draw|tied/.test(s))return "completed";
 if(/live|in progress|innings|stumps|day \d/.test(s))return "live";
 return "upcoming";
}
function scoreHtml(s){
 if(!s)return '<div class="small">Score unavailable</div>';
 const runs=s.runs??s.r??"—";
 const wickets=s.wickets??s.w??"—";
 const overs=s.overs??s.o??"—";
 return `<div class="score">${esc(runs)}/${esc(wickets)}</div>
 <div class="small">${esc(overs)} overs</div>`;
}
function teamHtml(name,s){
 return `<div class="team"><div class="flag">${flag(name)}</div>
 <div class="teamname">${esc(name||"Team TBC")}</div>${scoreHtml(s)}</div>`;
}
function card(m,i){
 const teams=Array.isArray(m.teams)?m.teams:[];
 const scores=Array.isArray(m.score)?m.score:[];
 const id=String(m.id||m.matchId||"");
 const valid=/^[\w-]+$/.test(id);
 const k=kind(m);
 return `<article class="card">
 <div class="head"><span>${esc(m.matchType||m.type||"CRICKET")} · ${esc(m.date||"")}</span>
 <span class="badge">${k==="live"?"● LIVE":k==="completed"?"RESULT":"FIXTURE"}</span></div>
 <div class="teams">${teamHtml(teams[0],scores[0])}${teamHtml(teams[1],scores[1])}</div>
 <div class="statusline">${esc(m.status||m.matchStatus||"Status unavailable")}<br>
 📍 ${esc(m.venue||"Venue unavailable")}<br>${esc(m.name||"")}</div>
 <div class="actions">${valid?`<button class="primary" data-score="${esc(id)}" data-target="score${i}">Full Scorecard</button>`:""}
 <button data-info="${i}">Match Info</button></div>
 <div class="details" id="score${i}" hidden></div>
 <div class="details" id="info${i}" hidden>${esc(m.dateTimeGMT||m.date||"")}</div>
 </article>`;
}
function render(){
 const list=filter==="all"?all:all.filter(m=>kind(m)===filter);
 $("matches").innerHTML=list.length?list.map(card).join(""):
 '<div class="empty">No matches found in this category from the API.</div>';
}
async function load(){
 if(busy)return;
 busy=true;$("refresh").disabled=true;
 $("status").textContent="Loading matches…";
 try{
  const r=await fetch(API,{cache:"no-store"});
  const b=await r.json();
  if(!r.ok)throw Error(b.message||b.error||"HTTP "+r.status);
  if(b.status&&b.status!=="success")throw Error(b.message||b.error||"API error");
  const list=Array.isArray(b.data)?b.data:
             Array.isArray(b.matches)?b.matches:null;
  if(!list)throw Error("Worker response has no match list. Check Worker endpoint and API quota.");
  all=list;
  $("status").textContent=`${all.length} matches loaded · ${new Date().toLocaleTimeString()}`;
  render();
 }catch(e){
  $("status").textContent="Match data unavailable: "+e.message;
  if(!all.length)$("matches").innerHTML=
   '<div class="empty">The cricket service is unavailable or its API quota is exhausted. Please try later.</div>';
 }finally{busy=false;$("refresh").disabled=false}
}
function fields(p,type){
 const aliases=type==="bat"?
 [["name","Player"],["runs","Runs"],["balls","Balls"],["fours","4s"],["sixes","6s"],["sr","SR"]]:
 [["name","Bowler"],["overs","Overs"],["runs","Runs"],["wickets","Wickets"],["economy","Economy"]];
 return aliases;
}
function getVal(p,key){
 const alt={name:["name","player","batsman","bowler","playerName"],
 runs:["runs","r"],balls:["balls","b"],fours:["fours","4s"],
 sixes:["sixes","6s"],sr:["sr","strikeRate"],
 overs:["overs","o"],wickets:["wickets","w"],economy:["economy","econ"]};
 for(const k of alt[key]||[key])if(p[k]!==undefined&&p[k]!==null)return p[k];
 return "—";
}
function table(title,rows,type){
 if(!Array.isArray(rows)||!rows.length)return "";
 const cols=fields(null,type);
 return `<h4>${title}</h4><div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join("")}</tr></thead><tbody>
 ${rows.map(p=>`<tr>${cols.map(c=>`<td>${esc(getVal(p,c[0]))}</td>`).join("")}</tr>`).join("")}
 </tbody></table></div>`;
}
function scorecard(data){
 let innings=Array.isArray(data)?data:
  (data.scorecard||data.innings||data.data||[]);
 if(!Array.isArray(innings))return "";
 if(!innings.length){
  const raw=JSON.stringify(data,null,2);
  return `<p class="muted">No detailed innings returned. Check the API plan and Worker response.</p>
  <pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(raw)}</pre>`;
 }
 return innings.map((inn,i)=>{
  const batting=inn.batting||inn.batsmen||inn.batsman||[];
  const bowling=inn.bowling||inn.bowlers||inn.bowler||[];
  return `<section class="inning"><h3>${esc(inn.inning||inn.team||"Innings "+(i+1))}</h3>
  ${table("Batting",batting,"bat")}${table("Bowling",bowling,"bowl")}</section>`;
 }).join("");
}
$("refresh").addEventListener("click",load);
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{
 filter=b.dataset.filter;
 document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));
 render();
}));
$("matches").addEventListener("click",async e=>{
 const inf=e.target.closest("[data-info]");
 if(inf){const el=$("info"+inf.dataset.info);el.hidden=!el.hidden;return;}
 const btn=e.target.closest("[data-score]");
 if(!btn)return;
 const el=$(btn.dataset.target);el.hidden=!el.hidden;
 if(el.hidden||el.dataset.loaded==="1")return;
 el.innerHTML='<p class="muted">Loading scorecard…</p>';
 try{
  const r=await fetch(SCORECARD+encodeURIComponent(btn.dataset.score),{cache:"no-store"});
  const b=await r.json();
  if(!r.ok)throw Error(b.message||b.error||"HTTP "+r.status);
  el.innerHTML=scorecard(b.data??b);
  el.dataset.loaded="1";
 }catch(err){
  el.innerHTML=`<p class="muted">Scorecard unavailable: ${esc(err.message)}</p>`;
 }
});
load();
// Conservative refresh to help protect the daily API quota.
setInterval(load,10*60*1000);
</script>
</body>
  </html>


<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07140c">
<title>Sky Cricket Akodha</title>
<style>
:root {
  --bg:#07140c; --card:#10251a; --green:#20df78;
  --muted:#a9c0b0; --line:#285139; --white:#f4fff7;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--white);
  font-family:Arial,sans-serif;
}
header {
  padding:22px 16px;
  background:linear-gradient(135deg,#164c2b,#07140c);
  border-bottom:1px solid var(--line);
}
.logo { font-size:24px;font-weight:900;color:var(--green); }
header p { color:var(--muted);font-size:13px; }
main { max-width:850px;width:calc(100% - 24px);margin:20px auto; }
.hero,.panel,.match {
  background:var(--card);border:1px solid var(--line);
  border-radius:15px;padding:16px;margin-bottom:14px;
}
h1 {font-size:24px;margin:0 0 8px;}
h2 {font-size:18px;margin:8px 0 14px;}
.muted {color:var(--muted);font-size:13px;}
button,select {
  border:0;border-radius:9px;padding:12px;font-weight:bold;
}
button {background:var(--green);color:#062011;cursor:pointer;}
button:disabled {opacity:.55;}
#status {color:var(--muted);padding:12px 0;line-height:1.5;}
.match-head {
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;flex-wrap:wrap;
}
.tag {
  color:var(--green);border:1px solid var(--line);
  border-radius:30px;padding:5px 9px;font-size:12px;
}
.teams {
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px;
}
.team {
  background:#08180e;padding:13px;border-radius:12px;
  text-align:center;overflow-wrap:anywhere;
}
.flag {font-size:28px;}
.team-name {font-weight:bold;margin:6px 0;}
.score {font-size:25px;font-weight:bold;color:var(--green);}
.section-title {
  margin:20px 0 10px;color:var(--green);font-size:16px;
}
.table-wrap {overflow-x:auto;}
table {border-collapse:collapse;width:100%;font-size:13px;min-width:440px;}
th,td {padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;}
th {color:var(--muted);font-weight:600;}
td.num,th.num {text-align:right;}
.notice {
  background:#2b2413;border:1px solid #705b2b;color:#ffe5ad;
  padding:12px;border-radius:10px;font-size:13px;line-height:1.5;
}
.error {color:#ffb6a9;}
footer {text-align:center;color:var(--muted);padding:25px 12px;font-size:12px;}
@media(max-width:420px) {
  .teams {gap:7px;}
  .team {padding:9px 5px;}
  .score {font-size:21px;}
}
</style>
</head>
<body>
<header>
  <div class="logo">🏏 SKY CRICKET AKODHA</div>
  <p>Live Scores • Match Centre • Scorecards</p>
</header>

<main>
  <section class="hero">
    <h1>Live Cricket Score</h1>
    <p class="muted">टीम स्कोर, खिलाड़ी और मैच की उपलब्ध जानकारी।</p>
    <button id="refresh">↻ Refresh Scores</button>
  </section>

  <div id="status" role="status" aria-live="polite">
    मैच डेटा लोड हो रहा है...
  </div>
  <div id="matches"></div>
</main>

<footer>
  © <span id="year"></span> Sky Cricket Akodha
  <br>स्कोर API की उपलब्ध जानकारी पर निर्भर है।
</footer>

<script>
"use strict";

const API_URL =
  "https://sky-cricket-live.skyyadavanshi.workers.dev/live-score";

const statusBox = document.getElementById("status");
const matchesBox = document.getElementById("matches");
const refreshButton = document.getElementById("refresh");

document.getElementById("year").textContent =
  new Date().getFullYear();

function el(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = String(text);
  if (cls) node.className = cls;
  return node;
}

function value(obj, keys) {
  for (const key of keys) {
    if (obj && obj[key] !== undefined && obj[key] !== null &&
        obj[key] !== "") return obj[key];
  }
  return null;
}

function countryFlag(name) {
  const n = String(name || "").toLowerCase();
  const flags = [
    [["india","indian"],"🇮🇳"],
    [["australia"],"🇦🇺"],
    [["england"],"🏴"],
    [["pakistan"],"🇵🇰"],
    [["new zealand"],"🇳🇿"],
    [["south africa"],"🇿🇦"],
    [["sri lanka"],"🇱🇰"],
    [["bangladesh"],"🇧🇩"],
    [["afghanistan"],"🇦🇫"],
    [["west indies"],"🏏"],
    [["ireland"],"🇮🇪"],
    [["zimbabwe"],"🇿🇼"],
    [["nepal"],"🇳🇵"],
    [["netherlands"],"🇳🇱"],
    [["united states","usa","u.s.a."],"🇺🇸"],
    [["united arab emirates","uae"],"🇦🇪"]
  ];
  for (const [names, flag] of flags) {
    if (names.some(x => n.includes(x))) return flag;
  }
  return "🏏";
}

function teamName(match, i) {
  if (Array.isArray(match.teams) && match.teams[i]) {
    return match.teams[i];
  }
  return i === 0 ? "Team 1" : "Team 2";
}

function scoreFor(match, team) {
  const entries = Array.isArray(match.score) ? match.score : [];
  const found = entries.find(s =>
    s && (
      s.inning && String(s.inning).toLowerCase().includes(
        String(team).toLowerCase()
      )
    )
  );
  const s = found || entries[match.teams?.indexOf(team)] || null;
  if (!s || typeof s !== "object") return "Score unavailable";

  const runs = value(s, ["r","runs"]);
  const wickets = value(s, ["w","wickets"]);
  const overs = value(s, ["o","overs"]);
  if (runs === null) return "Score unavailable";

  let result = String(runs);
  if (wickets !== null) result += "/" + wickets;
  if (overs !== null) result += " (" + overs + " ov)";
  return result;
}

function makeTable(headers, rows) {
  const wrap = el("div", undefined, "table-wrap");
  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const hr = document.createElement("tr");

  headers.forEach((h, i) =>
    hr.appendChild(el("th", h, i > 0 ? "num" : ""))
  );
  thead.appendChild(hr);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  rows.forEach(row => {
    const tr = document.createElement("tr");
    row.forEach((v, i) =>
      tr.appendChild(el("td", v, i > 0 ? "num" : ""))
    );
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

function getScorecard(match) {
  // अलग scorecard API की जानकारी मौजूदा response में
  // तभी इस्तेमाल होगी जब Worker उसे उपलब्ध कराए।
  const candidates = [
    match.scorecard,
    match.scoreCard,
    match.innings,
    match.batting,
    match.battingScorecard
  ];
  return candidates.find(x => Array.isArray(x) && x.length) || null;
}

function renderScorecard(card, match) {
  const box = el("section", undefined, "panel");
  box.appendChild(el("h2", "📋 खिलाड़ी और पूरा स्कोरकार्ड"));

  if (!card) {
    box.appendChild(el(
      "p",
      "इस API response में बल्लेबाज़ों, आउट होने के तरीके और गेंदबाज़ों का पूरा स्कोरकार्ड उपलब्ध नहीं है। इसके लिए Worker में match_scorecard API का सुरक्षित endpoint जोड़ना होगा।",
      "notice"
    ));
    return box;
  }

  card.forEach((inning, index) => {
    box.appendChild(el(
      "div",
      (inning.name || inning.inning || "Innings " + (index + 1)) +
      " — " + [
        value(inning, ["runs","r"]),
        value(inning, ["wickets","w"])
      ].filter(x => x !== null).join("/")
    , "section-title"));

    const batting = Array.isArray(inning.batting)
      ? inning.batting
      : Array.isArray(inning.batsmen) ? inning.batsmen : [];

    if (batting.length) {
      box.appendChild(el("h3", "🏏 बल्लेबाज़", ""));
      const rows = batting.map(p => [
        value(p, ["name","playerName","batsman"]) || "नाम उपलब्ध नहीं",
        value(p, ["runs","r"]) ?? "—",
        value(p, ["balls","b"]) ?? "—",
        value(p, ["fours","4s"]) ?? "—",
        value(p, ["sixes","6s"]) ?? "—",
        p.out === true ? (p.dismissal || "Out") :
          (p.dismissal || "Not marked out")
      ]);
      box.appendChild(makeTable(
        ["खिलाड़ी","रन","गेंद","4s","6s","आउट / स्थिति"], rows
      ));
    } else {
      box.appendChild(el("p", "इस पारी के बल्लेबाज़ी आँकड़े उपलब्ध नहीं हैं.", "muted"));
    }

    const bowling = Array.isArray(inning.bowling)
      ? inning.bowling
      : Array.isArray(inning.bowlers) ? inning.bowlers : [];

    if (bowling.length) {
      box.appendChild(el("h3", "🎯 गेंदबाज़", ""));
      const rows = bowling.map(p => [
        value(p, ["name","playerName","bowler"]) || "नाम उपलब्ध नहीं",
        value(p, ["overs","o"]) ?? "—",
        value(p, ["maidens","m"]) ?? "—",
        value(p, ["runs","r"]) ?? "—",
        value(p, ["wickets","w"]) ?? "—",
        value(p, ["economy","econ"]) ?? "—"
      ]);
      box.appendChild(makeTable(
        ["गेंदबाज़","ओवर","मैडन","रन","विकेट","इकॉनमी"], rows
      ));
    } else {
      box.appendChild(el("p", "इस पारी के गेंदबाज़ी आँकड़े उपलब्ध नहीं हैं.", "muted"));
    }
  });

  return box;
}

function renderMatch(match, index) {
  const card = el("article", undefined, "match");
  const teams = Array.isArray(match.teams) ? match.teams : [];
  const name = value(match, ["name","matchName"]) ||
    (teams.length ? teams.join(" vs ") : "Cricket Match");

  const head = el("div", undefined, "match-head");
  head.appendChild(el("strong", name));
  head.appendChild(el("span", value(match, ["status"]) || "Match details", "tag"));
  card.appendChild(head);

  const teamGrid = el("div", undefined, "teams");
  for (let i = 0; i < 2; i++) {
    const team = teamName(match, i);
    const tile = el("div", undefined, "team");
    tile.appendChild(el("div", countryFlag(team), "flag"));
    tile.appendChild(el("div", team, "team-name"));
    tile.appendChild(el("div", scoreFor(match, team), "score"));
    teamGrid.appendChild(tile);
  }
  card.appendChild(teamGrid);

  const meta = [
    ["📍 Venue", value(match, ["venue"])],
    ["📅 Date", value(match, ["date"])],
    ["Format", value(match, ["matchType","type"])],
    ["Result", value(match, ["status"])]
  ];
  meta.filter(item => item[1] !== null).forEach(item => {
    card.appendChild(el("p", item[0] + ": " + item[1], "muted"));
  });

  const detailButton = el("button", "देखें: खिलाड़ी और स्कोरकार्ड");
  detailButton.style.marginTop = "10px";
  detailButton.addEventListener("click", () => {
    const existing = card.querySelector(".scorecard-area");
    if (existing) {
      existing.remove();
      detailButton.textContent = "देखें: खिलाड़ी और स्कोरकार्ड";
      return;
    }
    const area = el("div", undefined, "scorecard-area");
    area.appendChild(renderScorecard(getScorecard(match), match));
    card.appendChild(area);
    detailButton.textContent = "स्कोरकार्ड छिपाएँ";
  });
  card.appendChild(detailButton);

  return card;
}

async function loadScores() {
  refreshButton.disabled = true;
  refreshButton.textContent = "लोड हो रहा है...";
  statusBox.textContent = "⏳ लाइव मैच डेटा लोड हो रहा है...";
  matchesBox.replaceChildren();

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);

  try {
    const response = await fetch(API_URL, {
      method: "GET",
      headers: {"Accept":"application/json"},
      cache: "no-store",
      signal: controller.signal
    });

    if (!response.ok) throw new Error("HTTP " + response.status);

    const json = await response.json();
    if (json.status === "failure" || json.error) {
      throw new Error(
        typeof json.error === "string" ? json.error : "API error"
      );
    }

    const data = Array.isArray(json.data) ? json.data :
      Array.isArray(json.matches) ? json.matches : null;

    if (!data) {
      throw new Error("Worker response में मैचों की सूची नहीं मिली।");
    }

    if (!data.length) {
      statusBox.textContent = "अभी कोई मैच डेटा उपलब्ध नहीं है।";
    } else {
      statusBox.textContent =
        "✅ " + data.length + " मैच मिले · अपडेट " +
        new Date().toLocaleTimeString("hi-IN");
      data.forEach((match, i) =>
        matchesBox.appendChild(renderMatch(match, i))
      );
    }
  } catch (err) {
    const message = err.name === "AbortError"
      ? "अनुरोध का समय समाप्त हुआ।"
      : err instanceof TypeError
        ? "नेटवर्क या CORS समस्या।"
        : (err.message || "अज्ञात समस्या");

    statusBox.textContent = "❌ स्कोर लोड नहीं हुआ: " + message;
    statusBox.className = "error";
  } finally {
    clearTimeout(timer);
    refreshButton.disabled = false;
    refreshButton.textContent = "↻ Refresh Scores";
  }
}

refreshButton.addEventListener("click", loadScores);
loadScores();
setInterval(loadScores, 60000);
</script>
</body>
  </html>
